name: Verify and publish Lienzo Java showcase
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  # Required to publish SpotBugs SARIF to code scanning.
  security-events: write
concurrency:
  group: lienzo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, instanto-container]
    timeout-minutes: 30
    env:
      FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
      FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN || secrets.FORGEJO_PACKAGES_TOKEN || secrets.FORGEJO_PACKAGE_READ_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - name: Allocate isolated caches
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/lienzo-browsers-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "MAVEN_CACHE=$RUNNER_TEMP/lienzo-m2-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - name: Check out compatibility baseline
        uses: actions/checkout@v7
        with:
          repository: instanto-io/teavm-compat
          ref: 94146a0a9860123693229ebb654cbc01ca61df6e
          path: .compat-baseline
      - name: Build compatibility baseline
        # Build from the baseline checkout so that Maven resolves its own
        # ${maven.multiModuleProjectDirectory} paths (SpotBugs filters, browser
        # coverage) against the baseline, not this repository. Its quality
        # gates are not this build's concern.
        working-directory: .compat-baseline
        run: mvn -s "$GITHUB_WORKSPACE/.github/maven-settings.xml" -B -ntp -Dmaven.repo.local="$MAVEN_CACHE" -Dspotbugs.skip=true -pl gwt-user-compat,elemental2-compat,gwt-resources-compat-maven-plugin -am install -DskipTests
      - name: Build libraries and showcases
        run: mvn -s .github/maven-settings.xml -B -ntp -Dmaven.repo.local="$MAVEN_CACHE" clean install -DskipTests
      - name: Install browsers
        run: >-
          mvn -s .github/maven-settings.xml -B -ntp -Dmaven.repo.local="$MAVEN_CACHE"
          -f lienzo-showcase-gwt/pom.xml org.codehaus.mojo:exec-maven-plugin:3.6.3:java
          -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install chromium webkit"
      - name: Verify standard build
        run: mvn -s .github/maven-settings.xml -B -ntp -Dmaven.repo.local="$MAVEN_CACHE" clean verify
      - name: Verify optimized build
        run: mvn -s .github/maven-settings.xml -B -ntp -Dmaven.repo.local="$MAVEN_CACHE" -Pproduction clean verify
      - name: Check formatting is committed
        run: git diff --exit-code
      - name: SonarQube analysis
        # Analysis belongs to the default branch only: a pull-request run would
        # otherwise replace the project's main analysis with unmerged code.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.SONAR_TOKEN != ''
        continue-on-error: true
        env:
          SONAR_HOST_URL: https://sonar.instanto.io
        run: >-
          mvn --settings .github/maven-settings.xml --batch-mode --no-transfer-progress
          -Dmaven.repo.local="$MAVEN_CACHE"
          sonar:sonar -Dsonar.projectKey=lienzo-java -Dsonar.projectName=lienzo-java
          -Dsonar.qualitygate.wait=true
      - name: Publish quality summary
        if: always()
        continue-on-error: true
        uses: instanto-io/instanto-poms/.github/actions/quality-summary@main
        with:
          sonar-project-key: lienzo-java
          sonar-token: ${{ secrets.SONAR_READ_TOKEN || secrets.SONAR_TOKEN }}
      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: '**/target/spotbugs/'
          if-no-files-found: ignore
          retention-days: 7
      - name: Collect both showcases
        run: |
          mkdir -p target/pages/gwt target/pages/legal
          cp -R lienzo-showcase-teavm/target/site/. target/pages/
          cp -R lienzo-showcase-gwt/target/site/. target/pages/gwt/
          cp LICENSE NOTICE target/pages/legal/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            lienzo-showcase-*/target/failsafe-reports/
            lienzo-showcase-*/target/*.png
            lienzo-*/target/spotbugs/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: target/pages
      - name: Remove isolated caches
        if: always()
        run: rm -rf -- "$MAVEN_CACHE" "$PLAYWRIGHT_BROWSERS_PATH"
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
